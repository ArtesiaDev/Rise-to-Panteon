[project]
name = "rtp-rag"
version = "0.1.0"
description = "Rise to Panteon: база знаний для агентов (поиск, контекст по путям, проверки)"
requires-python = ">=3.12,<3.14"
dependencies = [
    "mcp>=2.2,<3",
    "numpy>=1.26",
    "pyyaml>=6.0",
    "sentence-transformers>=3.0",
    "snowballstemmer>=2.2",
]

[project.scripts]
rag = "rag.cli:main"
rag-mcp = "rag.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rag"]
